[project]
name = "turnwise"
version = "0.0.1"
description = "Voice-first navigation layer for commercial fleets in India"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
backend = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Explicit package list: the repo has several top-level folders (app/, engine/,
# backend/, ...) and setuptools refuses to guess which ones are Python packages.
[tool.setuptools.packages.find]
include = ["voice*", "tools*", "engine*", "backend*"]

[tool.setuptools.package-data]
voice = ["templates/*.yaml"]
