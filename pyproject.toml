[project]
name = "turnwise"
version = "0.0.1"
description = "Voice-first navigation layer for commercial fleets in India"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Explicit package list: the repo has several top-level folders (app/, engine/,
# backend/, ...) and setuptools refuses to guess which ones are Python packages.
[tool.setuptools.packages.find]
include = ["voice*", "tools*"]

[tool.setuptools.package-data]
voice = ["templates/*.yaml"]
