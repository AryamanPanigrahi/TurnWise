# Alembic = the tool that versions the database schema, like git for tables.
#   alembic upgrade head      apply every migration not yet applied
#   alembic downgrade -1      undo the last one
#   alembic revision --autogenerate -m "what changed"   draft a new migration from backend/models.py
# The database URL comes from the DATABASE_URL environment variable (see .env.example).
[alembic]
script_location = backend/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
