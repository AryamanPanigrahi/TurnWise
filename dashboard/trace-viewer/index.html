<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trace viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --card: #fff; --line: #e7e5e4;
            --crawl: #dc2626; --slow: #f59e0b; --medium: #3b82f6; --fast: #16a34a; --unknown: #a8a29e; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg);
           display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
    aside { padding: 16px; overflow-y: auto; border-right: 1px solid var(--line); background: var(--card); }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p.hint { color: var(--muted); margin: 0 0 12px; }
    #drop { display: block; border: 2px dashed var(--line); border-radius: 8px; padding: 16px; text-align: center;
            color: var(--muted); cursor: pointer; }
    #drop.over { border-color: var(--medium); color: var(--fg); }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 16px 0; }
    dt { color: var(--muted); } dd { margin: 0; font-variant-numeric: tabular-nums; }
    ul { padding-left: 18px; margin: 8px 0; } li { margin: 2px 0; }
    li button { all: unset; cursor: pointer; text-decoration: underline; }
    .err { color: var(--crawl); }
    .legend span { display: inline-block; width: 12px; height: 4px; margin: 0 4px 2px 8px; vertical-align: middle; }
    #map { height: 100vh; }
    #scrub { width: 100%; margin-top: 12px; }
    @media (max-width: 700px) { body { grid-template-columns: 1fr; grid-template-rows: auto 60vh; height: auto; }
                                #map { height: 60vh; } }
  </style>
</head>
<body>
<aside>
  <h1>Trace viewer</h1>
  <p class="hint">Drop a <code>traces/*.jsonl</code> file, and its <code>.expected.json</code> if you
    have one. Files are read in your browser and never uploaded.</p>
  <label id="drop">Drop files here or click to choose
    <input id="files" type="file" accept=".jsonl,.json" multiple hidden>
  </label>
  <div id="out"></div>
  <p class="legend hint">Speed:<span style="background:var(--crawl)"></span>&lt;10
    <span style="background:var(--slow)"></span>&lt;30 <span style="background:var(--medium)"></span>&lt;50
    <span style="background:var(--fast)"></span>50+ km/h</p>
</aside>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script type="module">
import { formatIst, parseTrace, placeEvents, segmentsBySpeed, stats } from "./trace.js";

const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(`--${v}`).trim();
const map = L.map("map").setView([12.97, 77.59], 12);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "© OpenStreetMap contributors",
}).addTo(map);
let layer = L.layerGroup().addTo(map);
let state = { trace: null, expected: null, name: "" };
const cursor = L.circleMarker([0, 0], { radius: 7, color: "#000", weight: 2, fillOpacity: 0.9 });

const out = document.getElementById("out");
const input = document.getElementById("files");
const drop = document.getElementById("drop");
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); load(e.dataTransfer.files); });
input.addEventListener("change", () => load(input.files));

async function load(files) {
  for (const f of files) {
    const text = await f.text();
    if (f.name.endsWith(".expected.json")) {
      try { state.expected = JSON.parse(text); } catch { state.expected = { error: "not valid JSON" }; }
    } else if (f.name.endsWith(".jsonl")) {
      state.trace = parseTrace(text); state.name = f.name;
    }
  }
  render();
}

const el = (tag, attrs = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), attrs);
  n.append(...kids); return n;
};

function render() {
  layer.clearLayers(); out.replaceChildren();
  if (!state.trace) return;
  const { points, errors } = state.trace;
  if (!points.length) { out.append(el("p", { className: "err" }, "No valid points in this file.")); return; }

  for (const s of segmentsBySpeed(points)) {
    L.polyline(s.coords, { color: css(s.band), weight: 5, opacity: 0.85 }).addTo(layer);
  }
  L.circleMarker([points[0].lat, points[0].lon], { radius: 6, color: css("fast") })
    .bindTooltip("start").addTo(layer);
  L.circleMarker([points.at(-1).lat, points.at(-1).lon], { radius: 6, color: css("crawl") })
    .bindTooltip("end").addTo(layer);

  const st = stats(points);
  out.append(el("h2", { style: "font-size:15px;margin:16px 0 0" }, state.name),
    el("dl", {},
      el("dt", {}, "Points"), el("dd", {}, String(st.points)),
      el("dt", {}, "Distance"), el("dd", {}, `${(st.distanceM / 1000).toFixed(2)} km`),
      el("dt", {}, "Duration"), el("dd", {}, `${Math.round(st.durationS / 60)} min`),
      el("dt", {}, "Top speed"), el("dd", {}, `${Math.round(st.maxSpeedMps * 3.6)} km/h`),
      el("dt", {}, "Start"), el("dd", {}, formatIst(points[0].t)),
      el("dt", {}, "Gaps > 5 s"), el("dd", {}, String(st.gaps.length))));

  const scrub = el("input", { id: "scrub", type: "range", min: 0, max: points.length - 1, value: 0 });
  const now = el("p", { className: "hint" });
  const show = (i) => {
    const p = points[i];
    cursor.setLatLng([p.lat, p.lon]).addTo(layer);
    const kmh = p.speed == null ? "?" : Math.round(p.speed * 3.6);
    const hd = p.heading == null ? "–" : `${Math.round(p.heading)}°`;
    now.textContent = `${formatIst(p.t)} · ${kmh} km/h · heading ${hd} · ±${p.accuracy ?? "?"} m`;
    scrub.value = i;
  };
  scrub.addEventListener("input", () => show(+scrub.value));
  out.append(scrub, now);
  show(0);

  if (state.expected) {
    if (state.expected.error) out.append(el("p", { className: "err" }, `expected file: ${state.expected.error}`));
    const evs = placeEvents(points, state.expected);
    out.append(el("h2", { style: "font-size:15px;margin:16px 0 0" },
      `Expected events (${state.expected.clean ? "clean drive" : "has wrong turns"})`));
    const ul = el("ul");
    for (const ev of evs) {
      const label = `${ev.event} at ${Number.isNaN(ev.t) ? "?" : formatIst(ev.t)}${ev.note ? ` — ${ev.note}` : ""}`;
      if (!ev.point) { ul.append(el("li", { className: "err" }, `${label} (no time)`)); continue; }
      const color = ev.event === "off_route" ? css("crawl") : css("medium");
      L.marker([ev.point.lat, ev.point.lon], { title: label }).bindPopup(label).addTo(layer);
      L.circle([ev.point.lat, ev.point.lon], { radius: 30, color }).addTo(layer);
      ul.append(el("li", {}, el("button", { onclick: () => { show(ev.index); map.panTo([ev.point.lat, ev.point.lon]); } }, label)));
    }
    if (!evs.length) ul.append(el("li", { className: "hint" }, "none"));
    out.append(ul);
  }
  for (const g of st.gaps.slice(0, 10)) {
    const p = points[g.index];
    L.circleMarker([p.lat, p.lon], { radius: 4, color: css("slow") })
      .bindTooltip(`${Math.round(g.seconds)} s gap`).addTo(layer);
  }
  if (errors.length) out.append(el("p", { className: "err" }, `${errors.length} bad line(s): ${errors.slice(0, 3).join("; ")}`));
  map.fitBounds(L.latLngBounds(points.map((p) => [p.lat, p.lon])), { padding: [30, 30] });
}
</script>
</body>
</html>
