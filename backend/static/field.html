<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TurnWise field test</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#15202b; --muted:#5b6876; --line:#d8dee6;
          --accent:#0b6bcb; --danger:#c62828; --ok:#1b7f3b; --warn:#a15c00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10151b; --card:#1a222c; --ink:#eef2f6; --muted:#9aa7b4; --line:#2c3846;
            --accent:#58a6ff; --danger:#ff6b6b; --ok:#4cc38a; --warn:#f0b35a; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
               font:16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #map { height:42vh; min-height:240px; }
  main { padding:12px 16px 32px; max-width:720px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:12px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px; }
  label { display:block; font-size:13px; color:var(--muted); margin:8px 0 4px; }
  input[type=text], input[type=password], select {
    width:100%; padding:10px; border:1px solid var(--line); border-radius:8px;
    background:var(--bg); color:var(--ink); font-size:16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .row > * { flex:1 1 140px; }
  button { padding:14px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card);
           color:var(--ink); font-size:16px; font-weight:600; cursor:pointer; min-height:48px; }
  button.primary { background:var(--accent); color:#fff; border-color:transparent; }
  button.danger { background:var(--danger); color:#fff; border-color:transparent; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #banner { font-size:22px; font-weight:700; min-height:64px; display:flex; align-items:center; }
  #banner.alert { color:var(--danger); } #banner.ok { color:var(--ok); } #banner.info { color:var(--accent); }
  #status { font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
  #log { font:12px/1.5 ui-monospace, Menlo, Consolas, monospace; max-height:220px; overflow:auto;
         white-space:pre-wrap; overflow-wrap:anywhere; color:var(--muted); margin:0; }
  .check { display:flex; gap:8px; align-items:center; font-size:14px; color:var(--ink); }
  .check input { width:20px; height:20px; flex:none; }
  .hint { font-size:13px; color:var(--muted); margin:6px 0 0; }
</style>
</head>
<body>
<div id="map"></div>
<main>
  <div class="card">
    <div id="banner" class="info">Tap the map to choose a destination.</div>
    <div id="status">Not started.</div>
  </div>

  <div class="card" id="setup">
    <h2>Trip</h2>
    <label for="token">API token (TURNWISE_API_TOKEN from the server's .env)</label>
    <input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="row">
      <div><label for="lang">Voice language</label>
        <select id="lang"><option value="en">English</option><option value="hi">Hindi</option><option value="kn">Kannada</option></select></div>
      <div><label>&nbsp;</label>
        <label class="check"><input id="sim" type="checkbox"> Simulate the drive (no GPS)</label></div>
    </div>
    <p class="hint" id="simhint" hidden>Simulation: first tap = start, second tap = destination. The drive runs 10 times faster than real time.</p>
    <div class="row" style="margin-top:12px">
      <button id="start" class="primary">Start trip</button>
      <button id="end" class="danger" disabled>End trip</button>
    </div>
    <div class="row" id="simctl" hidden style="margin-top:8px">
      <button id="wrong">Take a wrong turn</button>
    </div>
  </div>

  <div class="card">
    <h2>Ask</h2>
    <div class="row">
      <button class="ask" data-intent="which_branch" disabled>Flyover or service road?</button>
      <button class="ask" data-intent="left_or_right" disabled>Left or right?</button>
      <button class="ask" data-intent="distance_to_next" disabled>How far to the next turn?</button>
      <button class="ask" data-intent="am_i_wrong" disabled>Am I on the right road?</button>
      <button class="ask" data-intent="eta" disabled>How long left?</button>
    </div>
  </div>

  <div class="card">
    <h2>Log</h2>
    <pre id="log"></pre>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const store = { get(k){ try { return localStorage.getItem(k) || ""; } catch { return ""; } },
                set(k,v){ try { localStorage.setItem(k, v); } catch {} } };
const S = { trip:null, ws:null, watch:null, queue:[], flush:null, lastSeq:0, sent:0, events:0,
            origin:null, dest:null, route:null, cum:null, simTimer:null, simAlong:0, simT:null,
            simOff:0, simWrong:false, wake:null, lastFix:null };

// ---- map -----------------------------------------------------------------------------
const map = L.map("map").setView([12.9716, 77.5946], 12);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  { maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" }).addTo(map);
const layers = { origin:null, dest:null, route:null, me:null, points:L.layerGroup().addTo(map) };
// Leaflet measures its box once; re-measure after layout and on rotation/resize or tiles only fill a strip.
const remeasure = () => map.invalidateSize();
window.addEventListener("load", remeasure); window.addEventListener("resize", remeasure); setTimeout(remeasure, 300);

function setMarker(key, latlng, label) {
  if (layers[key]) layers[key].remove();
  layers[key] = L.marker(latlng, { title: label }).addTo(map).bindTooltip(label, { permanent:true, direction:"top" });
}
map.on("click", e => {
  if (S.trip) return;
  const p = [e.latlng.lat, e.latlng.lng];
  if ($("sim").checked && (!S.origin || S.dest)) { S.origin = p; S.dest = null; setMarker("origin", p, "Start");
    if (layers.dest) { layers.dest.remove(); layers.dest = null; }
    banner("Now tap the destination.", "info"); return; }
  S.dest = p; setMarker("dest", p, "Destination"); banner("Ready. Press Start trip.", "info");
});

// ---- small helpers ---------------------------------------------------------------------
function log(msg) { const el = $("log"); el.textContent = new Date().toLocaleTimeString() + "  " + msg + "\n" + el.textContent; }
function banner(text, kind) { const b = $("banner"); b.textContent = text; b.className = kind || ""; }
function status() {
  const f = S.lastFix;
  $("status").textContent = S.trip
    ? `Trip ${S.trip.slice(0, 12)}…  fixes sent ${S.sent}  queued ${S.queue.length}  events ${S.events}` +
      (f ? `  accuracy ${f.accuracy == null ? "?" : Math.round(f.accuracy) + " m"}  speed ${f.speed == null ? "?" : (f.speed * 3.6).toFixed(0) + " km/h"}` : "")
    : "Not started.";
}
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { "Authorization": "Bearer " + $("token").value.trim(),
    "Content-Type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) });
  if (!r.ok) { let d = ""; try { d = (await r.json()).detail; } catch {} throw new Error(`${r.status} ${typeof d === "string" ? d : JSON.stringify(d)}`); }
  return r.status === 204 ? null : r.json();
}
const VOICE = { en:"en-IN", hi:"hi-IN", kn:"kn-IN" };
function speak(text) {
  if (!text || !("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text); u.lang = VOICE[$("lang").value] || "en-IN";
  speechSynthesis.cancel(); speechSynthesis.speak(u);       // an alert interrupts whatever was being said
}
async function say(payload, kind) {
  try {
    const r = await api("POST", "/field/api/say", { lang: $("lang").value, ...payload });
    if (r.text) { banner(r.text, kind); speak(r.text); log("SAID  " + r.text); }
    return r.text;
  } catch (e) { log("say failed: " + e.message); }
}

// ---- geometry (for the map and the simulator only; the engine does the real work) -----------
const R = 6371008.8, rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
function dist(a, b) { const p1 = rad(a[0]), p2 = rad(b[0]), dp = p2 - p1, dl = rad(b[1] - a[1]);
  const h = Math.sin(dp/2)**2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2)**2; return 2 * R * Math.asin(Math.sqrt(h)); }
function bearing(a, b) { const p1 = rad(a[0]), p2 = rad(b[0]), dl = rad(b[1] - a[1]);
  return (deg(Math.atan2(Math.sin(dl) * Math.cos(p2), Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl))) + 360) % 360; }
function dest(a, brg, d) { const p1 = rad(a[0]), l1 = rad(a[1]), b = rad(brg), g = d / R;
  const p2 = Math.asin(Math.sin(p1) * Math.cos(g) + Math.cos(p1) * Math.sin(g) * Math.cos(b));
  return [deg(p2), deg(l1 + Math.atan2(Math.sin(b) * Math.sin(g) * Math.cos(p1), Math.cos(g) - Math.sin(p1) * Math.sin(p2)))]; }
function pointAt(s) { const c = S.cum, r = S.route; s = Math.max(0, Math.min(s, c[c.length - 1]));
  let i = 0; while (i < r.length - 2 && c[i + 1] < s) i++;
  const b = bearing(r[i], r[i + 1]); return { pos: dest(r[i], b, s - c[i]), brg: b }; }

// ---- GPS out ---------------------------------------------------------------------------------
function pushFix(fix) {
  S.lastFix = fix; S.queue.push(fix);
  const ll = [fix.lat, fix.lon];
  if (!layers.me) layers.me = L.circleMarker(ll, { radius: 8, color: "#0b6bcb", fillOpacity: .9 }).addTo(map);
  else layers.me.setLatLng(ll);
  status();
}
async function flush() {
  if (!S.trip || !S.queue.length) return;
  const batch = S.queue.splice(0, 600);
  try { const r = await api("POST", "/v1/gps", { points: batch }); S.sent += r.accepted; }
  catch (e) { if (S.trip && !/^40[39]/.test(e.message)) S.queue.unshift(...batch);   // offline: keep and retry
              log("gps upload failed: " + e.message); }
  status();
}
function startGps() {
  S.watch = navigator.geolocation.watchPosition(p => {
    const c = p.coords, moving = c.speed != null && c.speed >= 0.5;
    pushFix({ trip_id: S.trip, ts: new Date(p.timestamp).toISOString(), lat: c.latitude, lon: c.longitude,
      speed: c.speed == null || isNaN(c.speed) ? null : Math.max(0, c.speed),
      heading: moving && c.heading != null && !isNaN(c.heading) ? ((c.heading % 360) + 360) % 360 : null,
      accuracy: c.accuracy == null ? null : c.accuracy });
  }, e => log("GPS error: " + e.message), { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
}
function startSim() {
  S.simAlong = 0; S.simOff = 0; S.simT = Date.now(); const speed = 12;       // m/s, one fix per simulated second
  S.simTimer = setInterval(() => {
    S.simOff = Math.max(0, S.simOff + (S.simWrong ? speed : -speed));
    if (!S.simWrong || S.simOff === 0) S.simAlong += speed;
    const { pos, brg } = pointAt(S.simAlong);
    const p = S.simOff ? dest(pos, (brg + 90) % 360, S.simOff) : pos;         // off route = sideways from the road
    const jitter = () => (Math.random() - .5) * 6;
    const q = dest(dest(p, 0, jitter()), 90, jitter());
    S.simT += 1000;
    pushFix({ trip_id: S.trip, ts: new Date(S.simT).toISOString(), lat: q[0], lon: q[1], speed: speed,
      heading: S.simWrong && S.simOff ? (brg + 90) % 360 : (S.simOff ? (brg + 270) % 360 : brg), accuracy: 6 });
    map.panTo(q, { animate: false });
    if (S.simAlong >= S.cum[S.cum.length - 1]) { clearInterval(S.simTimer); S.simTimer = null; }
  }, 100);
}

// ---- events in --------------------------------------------------------------------------------
function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/v1/trips/${S.trip}/events?last_seq=${S.lastSeq}`,
                           ["turnwise", $("token").value.trim()]);
  S.ws = ws;
  ws.onmessage = m => {
    const ev = JSON.parse(m.data); S.lastSeq = ev.seq; S.events++; status();
    log(`EVENT ${ev.event} ${JSON.stringify(ev.data)}`);
    if (ev.event === "off_route") say({ event: ev.event, data: ev.data }, "alert");
    else if (ev.event === "back_on_route") say({ event: ev.event, data: ev.data }, "ok");
    else if (ev.event === "decision_point_ahead") say({ event: ev.event, data: ev.data }, "info");
    else if (ev.event === "arrived") banner("Arrived.", "ok");
  };
  ws.onclose = () => { if (S.trip && S.ws === ws) { log("events socket closed; reconnecting"); setTimeout(connect, 2000); } };
}

// ---- trip lifecycle ---------------------------------------------------------------------------
function currentPosition() {
  return new Promise((ok, no) => navigator.geolocation.getCurrentPosition(
    p => ok([p.coords.latitude, p.coords.longitude]), e => no(new Error("GPS: " + e.message)),
    { enableHighAccuracy: true, timeout: 20000 }));
}
async function start() {
  const sim = $("sim").checked;
  if (!$("token").value.trim()) return banner("Enter the API token first.", "alert");
  if (!S.dest) return banner("Tap the map to choose a destination.", "alert");
  if (sim && !S.origin) return banner("Tap the map to choose a start point.", "alert");
  $("start").disabled = true; store.set("tw_token", $("token").value.trim()); store.set("tw_lang", $("lang").value);
  speak(" ");                                    // unlock speech on this user gesture (mobile browsers need it)
  try {
    if (!sim) { banner("Waiting for GPS…", "info"); S.origin = await currentPosition(); setMarker("origin", S.origin, "Start"); }
    banner("Planning the route…", "info");
    const t = await api("POST", "/v1/trips", { origin: { lat: S.origin[0], lon: S.origin[1] },
                                               destination: { lat: S.dest[0], lon: S.dest[1] } });
    S.trip = t.trip_id; S.lastSeq = 0; S.sent = 0; S.events = 0; S.queue = [];
    const r = await api("GET", `/field/api/trips/${S.trip}/route`);
    S.route = r.route; S.cum = [0]; for (let i = 1; i < r.route.length; i++) S.cum.push(S.cum[i - 1] + dist(r.route[i - 1], r.route[i]));
    layers.route = L.polyline(r.route, { color: "#0b6bcb", weight: 5, opacity: .8 }).addTo(map);
    map.fitBounds(layers.route.getBounds(), { padding: [20, 20] });
    layers.points.clearLayers();
    for (const p of r.decision_points) {
      const at = pointAt(p.at_m).pos;
      L.circleMarker(at, { radius: 6, color: "#a15c00" }).addTo(layers.points)
        .bindPopup(`${p.type}: ${p.on_route}${p.on_route_name ? " (" + p.on_route_name + ")" : ""}<br>confidence ${p.confidence}`);
    }
    log(`trip ${S.trip}: ${(t.length_m / 1000).toFixed(1)} km, ${t.decision_points} decision points`);
    connect(); S.flush = setInterval(flush, sim ? 500 : 2000);
    if (sim) { startSim(); $("simctl").hidden = false; } else startGps();
    try { S.wake = await navigator.wakeLock?.request("screen"); } catch {}
    document.querySelectorAll(".ask").forEach(b => b.disabled = false);
    $("end").disabled = false; banner("Trip started. Drive safely.", "ok"); status();
  } catch (e) { banner("Could not start: " + e.message, "alert"); log("start failed: " + e.message); $("start").disabled = false; }
}
async function end() {
  const trip = S.trip; if (!trip) return;
  if (S.watch != null) navigator.geolocation.clearWatch(S.watch);
  clearInterval(S.simTimer); clearInterval(S.flush); await flush();
  S.trip = null; S.watch = null; S.simTimer = null;
  try { S.ws?.close(); } catch {}
  try { await api("POST", `/v1/trips/${trip}/end`); log("trip ended"); } catch (e) { log("end failed: " + e.message); }
  try { await S.wake?.release(); } catch {}
  document.querySelectorAll(".ask").forEach(b => b.disabled = true);
  $("end").disabled = true; $("start").disabled = false; $("simctl").hidden = true;
  banner("Trip ended. Tap the map for a new destination.", "info"); status();
}
async function ask(intent) {
  const slots = intent === "which_branch" ? { options: ["flyover", "service_road"] } : {};
  try {
    await flush();                                 // answer from the freshest position
    const a = await api("POST", "/v1/ask", { trip_id: S.trip, intent, slots });
    log(`ASK   ${intent} -> ${a.answer_key} ${JSON.stringify(a.facts)}`);
    await say({ answer_key: a.answer_key, facts: a.facts }, a.answer_key.startsWith("am_i_wrong.off") ? "alert" : "info");
  } catch (e) { log("ask failed: " + e.message); }
}

// ---- wiring -------------------------------------------------------------------------------------
$("token").value = store.get("tw_token"); if (store.get("tw_lang")) $("lang").value = store.get("tw_lang");
$("start").onclick = start; $("end").onclick = end;
$("sim").onchange = () => { $("simhint").hidden = !$("sim").checked; };
$("wrong").onclick = () => { S.simWrong = !S.simWrong; $("wrong").textContent = S.simWrong ? "Go back to the route" : "Take a wrong turn"; };
document.querySelectorAll(".ask").forEach(b => b.onclick = () => ask(b.dataset.intent));
document.addEventListener("visibilitychange", async () => {       // the wake lock is dropped when the tab hides
  if (document.visibilityState === "visible" && S.trip) { try { S.wake = await navigator.wakeLock?.request("screen"); } catch {} } });
if (new URLSearchParams(location.search).has("sim")) { $("sim").checked = true; $("simhint").hidden = false; }
if (!window.isSecureContext) banner("Open this page over https (or on localhost): the browser blocks GPS on plain http.", "alert");
</script>
</body>
</html>
